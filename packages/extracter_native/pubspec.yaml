name: extracter_native
description: "On-device transcription for Extracter: FFmpeg decoding + whisper.cpp via FFI."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.13.1
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  meta: ^1.17.0

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
